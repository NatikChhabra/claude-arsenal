name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python plugins/workflow/scripts/skill_lint.py plugins
      - run: python plugins/workflow/hooks/test_hooks.py
      - name: music and marketing tool selftests (stdlib + ffmpeg)
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python plugins/music-studio/tools/lyric_lint.py --selftest
          python plugins/music-studio/tools/loudness.py --selftest
          python plugins/music-studio/tools/listening_taste.py --selftest
          python plugins/marketing-studio/tools/rollout.py --selftest
          python plugins/marketing-studio/tools/copy_lint.py --selftest
          python plugins/workflow/scripts/redact.py --selftest
      - name: design, video-edit and beatmap selftests (numpy, OCR, librosa)
        env:
          STILL_CHECK_DEPS: "1"
        run: |
          python -m pip install -q pillow numpy scipy rapidocr-onnxruntime librosa soundfile praat-parselmouth
          python plugins/design/skills/design/tools/still_check.py --selftest
          python plugins/design/skills/design/tools/paper_kit.py --selftest
          python plugins/video-edit/tools/watch.py --selftest
          python plugins/video-edit/tools/vo_bestof.py --selftest
          python plugins/music-studio/tools/beatmap.py --selftest
          python plugins/music-studio/tools/voice_range.py --selftest
          python plugins/music-studio/tools/vocal_comp.py --selftest
          python plugins/music-studio/tools/guitar_level.py --selftest
